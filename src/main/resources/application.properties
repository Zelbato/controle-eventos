spring.application.name=controle-eventos
# Porta 8081: a 8080 já é usada por outro container no PC de desenvolvimento.
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/controle_eventos}
spring.datasource.username=${DB_USERNAME:eventos_app}
spring.datasource.password=${DB_PASSWORD:eventos_local_2026}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Parte 09: administrador criado automaticamente na primeira execução (CargaInicial).
# Os valores após os dois-pontos são apenas padrões de aula. Defina variáveis
# de ambiente próprias antes de publicar o projeto; não versione senhas reais.
app.admin.email=${APP_ADMIN_EMAIL:admin@eventos.com}
app.admin.password=${APP_ADMIN_PASSWORD:admin123}

# Parte 09 (item 18): cria também uma conta PARTICIPANTE de teste.
# Use false para não criar.
app.carga.participante-teste=${APP_PARTICIPANTE_TESTE:true}

# Desenvolvimento: recarrega os templates HTML sem reiniciar a aplicação.
spring.thymeleaf.cache=false
