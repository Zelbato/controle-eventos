<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Ícones SVG usados no sistema (traço 2px, herdam a cor do texto).
  Uso: <svg th:replace="~{fragments/icones :: i('calendario')}"></svg>
-->
<svg th:fragment="i(nome)" class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <th:block th:switch="${nome}">
        <th:block th:case="'inicio'"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></th:block>
        <th:block th:case="'calendario'"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></th:block>
        <th:block th:case="'marca'"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"/></th:block>
        <th:block th:case="'usuarios'"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></th:block>
        <th:block th:case="'usuario'"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></th:block>
        <th:block th:case="'ticket'"><path d="M2 9a3 3 0 0 0 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 0 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z"/><path d="M13 5v2M13 11v2M13 17v2"/></th:block>
        <th:block th:case="'grafico'"><path d="M3 3v18h18"/><path d="M7 16v-5M12 16V8M17 16v-3"/></th:block>
        <th:block th:case="'catalogo'"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></th:block>
        <th:block th:case="'sair'"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></th:block>
        <th:block th:case="'mais'"><path d="M12 5v14M5 12h14"/></th:block>
        <th:block th:case="'editar'"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></th:block>
        <th:block th:case="'lixeira'"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/></th:block>
        <th:block th:case="'relogio'"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></th:block>
        <th:block th:case="'local'"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></th:block>
        <th:block th:case="'voltar'"><path d="m15 18-6-6 6-6"/></th:block>
        <th:block th:case="'seta'"><path d="M5 12h14M13 6l6 6-6 6"/></th:block>
        <th:block th:case="'ok'"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m22 4-10 10.01-3-3"/></th:block>
        <th:block th:case="'alerta'"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></th:block>
        <th:block th:case="'menu'"><path d="M3 6h18M3 12h18M3 18h18"/></th:block>
        <th:block th:case="'escudo'"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></th:block>
        <th:block th:case="'cancelar'"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></th:block>
        <th:block th:case="'historico'"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/></th:block>
        <th:block th:case="'cadeado'"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></th:block>
        <th:block th:case="'raio'"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></th:block>

        <th:block th:case="'filtro'"><path d="M22 3H2l8 9.46V19l4 2v-8.54z"/></th:block>
        <th:block th:case="'info'"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></th:block>
        <th:block th:case="'impressora'"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></th:block>
        <th:block th:case="'download'"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/></th:block>
        <th:block th:case="*"><circle cx="12" cy="12" r="9"/></th:block>
    </th:block>
</svg>
</body>
</html>
