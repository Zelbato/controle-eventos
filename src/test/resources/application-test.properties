# Usado apenas por "mvn test": banco H2 em memória no modo PostgreSQL.
spring.datasource.url=jdbc:h2:mem:eventos;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
app.admin.email=admin@eventos.com
app.admin.password=admin123
app.carga.participante-teste=true
